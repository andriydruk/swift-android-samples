name: Linux

on: 
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-24.04
    
    steps:
    - uses: actions/checkout@v4

    - name: Install swift android sdk
      shell: bash
      run: |
        set -ex
        swift sdk install https://github.com/swift-android-sdk/swift-android-sdk/releases/download/6.2/swift-6.2-RELEASE-android-0.1.artifactbundle.tar.gz --checksum ca7e09f09a591b6a661a39134aaf53b1b59d5e3a193b271ab1f20effdfc6e88e
        $HOME/.config/swiftpm/swift-sdks/swift-6.2-RELEASE-android-0.1.artifactbundle/swift-android/scripts/setup-android-sdk.sh
        
        git clone https://github.com/apple/swift-argument-parser.git
        cd swift-argument-parser/
        swift build --swift-sdk aarch64-unknown-linux-android29 --build-tests --verbose

    - name: Assemble all projects
      shell: bash
      run: ./gradlew assemble

