name: macOS

on: 
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: macos-15
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install swiftly
      shell: bash
      run: curl -O https://download.swift.org/swiftly/darwin/swiftly.pkg &&
        installer -pkg swiftly.pkg -target CurrentUserHomeDirectory &&
        ~/.swiftly/bin/swiftly init --quiet-shell-followup &&
        . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh" &&
        hash -r
    
    - name: Install swift andorid sdk
      shell: bash
      run: |
        source ~/.swiftly/env.sh
        swiftly install 6.2.0
        swift sdk install https://github.com/swift-android-sdk/swift-android-sdk/releases/download/6.2/swift-6.2-RELEASE-android-0.1.artifactbundle.tar.gz --checksum ca7e09f09a591b6a661a39134aaf53b1b59d5e3a193b271ab1f20effdfc6e88e
        ~/Library/org.swift.swiftpm/swift-sdks/swift-6.2-RELEASE-android-0.1.artifactbundle/swift-android/scripts/setup-android-sdk.sh

    - name: Assemble all projects
      shell: bash
      run: ./gradlew assemble

